name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify TypeScript and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Check TypeScript
        run: pnpm check

  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Configure official release signing
        env:
          ANTER_UPLOAD_STORE_FILE: ${{ runner.temp }}/anter-messenger-release.jks
          ANTER_UPLOAD_STORE_PASSWORD: ${{ secrets.ANTER_ANDROID_KEYSTORE_PASSWORD }}
          ANTER_UPLOAD_KEY_ALIAS: ${{ secrets.ANTER_ANDROID_KEY_ALIAS }}
          ANTER_UPLOAD_KEY_PASSWORD: ${{ secrets.ANTER_ANDROID_KEY_PASSWORD }}
          ANTER_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANTER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANTER_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$ANTER_UPLOAD_STORE_PASSWORD" ] && [ -n "$ANTER_UPLOAD_KEY_ALIAS" ] && [ -n "$ANTER_UPLOAD_KEY_PASSWORD" ]; then
            printf '%s' "$ANTER_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ANTER_UPLOAD_STORE_FILE"
            cat >> android/gradle.properties <<EOF
            ANTER_UPLOAD_STORE_FILE=$ANTER_UPLOAD_STORE_FILE
            ANTER_UPLOAD_STORE_PASSWORD=$ANTER_UPLOAD_STORE_PASSWORD
            ANTER_UPLOAD_KEY_ALIAS=$ANTER_UPLOAD_KEY_ALIAS
            ANTER_UPLOAD_KEY_PASSWORD=$ANTER_UPLOAD_KEY_PASSWORD
            EOF
            python3 scripts/configure-release-signing.py android/app/build.gradle
          else
            echo "Official signing secrets are not configured yet; building with the existing update-compatible signing fallback."
          fi
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANTER-Messenger-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
